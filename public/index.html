<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf7f2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Our Diary">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<title>Our Diary</title>
<style>
  :root {
    --bg: #faf7f2;
    --card: #ffffff;
    --ink: #3d3630;
    --ink-soft: #8c8378;
    --line: #ece5da;
    --me: #e8735a;      /* 내 글 포인트 */
    --me-soft: #fdeee9;
    --you: #5a8ac4;     /* 상대 글 포인트 */
    --you-soft: #eaf1f9;
    --accent: #e8735a;
    --radius: 16px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    background: var(--bg); color: var(--ink);
    min-height: 100dvh;
    padding-bottom: env(safe-area-inset-bottom);
  }
  #app { max-width: 560px; margin: 0 auto; padding: 0 16px 96px; }

  /* ---- 헤더 ---- */
  header {
    position: sticky; top: 0; z-index: 10;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(8px);
    padding: calc(14px + env(safe-area-inset-top)) 0 10px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 19px; letter-spacing: -0.3px; }
  header h1 .heart { color: var(--accent); }
  #daysBadge { font-size: 12px; color: var(--ink-soft); }

  /* ---- 설정(첫 실행) 화면 ---- */
  .setup {
    margin-top: 12vh; background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 28px 22px; text-align: center;
  }
  .setup .big { font-size: 40px; margin-bottom: 8px; }
  .setup h2 { font-size: 20px; margin-bottom: 6px; }
  .setup p { font-size: 13.5px; color: var(--ink-soft); margin-bottom: 20px; line-height: 1.6; }
  .setup label { display: block; text-align: left; font-size: 12.5px; color: var(--ink-soft); margin: 14px 0 5px; }
  .setup input {
    width: 100%; font-size: 16px; padding: 12px 14px;
    border: 1.5px solid var(--line); border-radius: 12px; background: var(--bg);
    color: var(--ink); outline: none;
  }
  .setup input:focus { border-color: var(--accent); }
  .setup .err { color: #c94f36; font-size: 13px; margin-top: 12px; min-height: 18px; }

  button.primary {
    width: 100%; margin-top: 18px; padding: 14px; font-size: 16px; font-weight: 700;
    background: var(--accent); color: #fff; border: none; border-radius: 12px;
    cursor: pointer;
  }
  button.primary:active { transform: scale(0.98); }
  button.primary:disabled { opacity: 0.5; }

  /* ---- 작성 카드 ---- */
  .compose {
    margin-top: 16px; background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 14px;
  }
  .compose .row { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
  .compose input[type=date] {
    font-size: 14px; padding: 7px 10px; border: 1px solid var(--line);
    border-radius: 10px; background: var(--bg); color: var(--ink); font-family: inherit;
  }
  .moods { display: flex; gap: 4px; margin-left: auto; }
  .moods button {
    font-size: 18px; background: none; border: 2px solid transparent;
    border-radius: 50%; width: 34px; height: 34px; cursor: pointer;
  }
  .moods button.sel { border-color: var(--accent); background: var(--me-soft); }
  .compose textarea {
    width: 100%; min-height: 88px; font-size: 16px; line-height: 1.6;
    border: none; resize: vertical; outline: none; background: transparent;
    color: var(--ink); font-family: inherit;
  }
  .compose textarea::placeholder { color: #c0b8ac; }
  .thumbs { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
  .thumbs .t { position: relative; }
  .thumbs img { width: 64px; height: 64px; object-fit: cover; border-radius: 10px; display: block; }
  .thumbs .x {
    position: absolute; top: -6px; right: -6px; width: 20px; height: 20px;
    border-radius: 50%; background: var(--ink); color: #fff; border: none;
    font-size: 12px; line-height: 1; cursor: pointer;
  }
  .compose .actions { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
  .btn-photo {
    display: flex; align-items: center; gap: 6px; font-size: 14px;
    padding: 9px 14px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--bg); color: var(--ink); cursor: pointer;
  }
  .btn-save {
    margin-left: auto; padding: 10px 22px; font-size: 15px; font-weight: 700;
    background: var(--accent); color: #fff; border: none; border-radius: 10px; cursor: pointer;
  }
  .btn-save:disabled { opacity: 0.45; }

  /* ---- 타임라인 ---- */
  .day { margin-top: 26px; }
  .day-label {
    display: flex; align-items: center; gap: 10px;
    font-size: 13px; font-weight: 700; color: var(--ink-soft);
  }
  .day-label::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .entry {
    margin-top: 10px; background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 14px 14px 12px; position: relative;
    border-left: 4px solid var(--you);
  }
  .entry.mine { border-left-color: var(--me); }
  .entry .meta { display: flex; align-items: baseline; gap: 8px; margin-bottom: 6px; }
  .entry .who { font-weight: 800; font-size: 14px; color: var(--you); }
  .entry.mine .who { color: var(--me); }
  .entry .mood { font-size: 15px; }
  .entry .time { font-size: 11.5px; color: var(--ink-soft); margin-left: auto; }
  .entry .text { font-size: 15px; line-height: 1.75; white-space: pre-wrap; word-break: break-word; }
  .entry .pics { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 6px; margin-top: 10px; }
  .entry .pics img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 10px; cursor: pointer; display: block; }
  .entry .del {
    position: absolute; right: 10px; bottom: 8px; font-size: 11px;
    color: #c0b8ac; background: none; border: none; cursor: pointer;
  }
  .empty { text-align: center; color: var(--ink-soft); font-size: 14px; margin-top: 60px; line-height: 1.8; }

  /* ---- 사진 크게 보기 ---- */
  #viewer {
    position: fixed; inset: 0; background: rgba(20,15,10,0.92); z-index: 50;
    display: none; align-items: center; justify-content: center;
  }
  #viewer.on { display: flex; }
  #viewer img { max-width: 96vw; max-height: 92vh; border-radius: 8px; }

  #toast {
    position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%);
    background: var(--ink); color: #fff; font-size: 13.5px;
    padding: 10px 18px; border-radius: 20px; opacity: 0; transition: opacity .25s;
    pointer-events: none; z-index: 60; white-space: nowrap;
  }
  #toast.on { opacity: 1; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Our Diary <span class="heart">♥</span></h1>
    <span id="daysBadge"></span>
  </header>

  <!-- 첫 실행 설정 -->
  <div id="setup" class="setup hidden">
    <div class="big">📖</div>
    <h2>Our Diary</h2>
    <p>A place to share each day, even far apart.<br>Enter with the code only you two know.</p>
    <label>Couple code</label>
    <input id="inCode" type="password" placeholder="Your secret code" autocomplete="off">
    <label>My name (shown on entries)</label>
    <input id="inName" type="text" maxlength="20" placeholder="e.g. Moonhyeon">
    <div class="err" id="setupErr"></div>
    <button class="primary" id="btnEnter">Open our diary</button>
  </div>

  <!-- 메인 -->
  <div id="main" class="hidden">
    <div class="compose">
      <div class="row">
        <input type="date" id="inDate">
        <div class="moods" id="moods"></div>
      </div>
      <textarea id="inText" placeholder="How was your day?"></textarea>
      <div class="thumbs" id="thumbs"></div>
      <div class="actions">
        <label class="btn-photo">📷 Photos
          <input type="file" id="inPhoto" accept="image/*" multiple style="display:none">
        </label>
        <button class="btn-save" id="btnSave">Save</button>
      </div>
    </div>
    <div id="timeline"></div>
  </div>
</div>

<div id="viewer"><img id="viewerImg" alt=""></div>
<div id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
const MOODS = ['😊','🥰','😴','😢','😤','🤒'];
const state = {
  code: localStorage.getItem('code') || '',
  name: localStorage.getItem('name') || '',
  mood: '', photos: [], entries: [],
};

// ---------- API ----------
async function api(path, opts = {}) {
  const res = await fetch(path, {
    ...opts,
    headers: { 'Content-Type': 'application/json', 'x-couple-code': state.code, ...(opts.headers || {}) },
  });
  if (res.status === 401) { logout(); throw new Error('unauthorized'); }
  if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || res.status);
  return res.json();
}
function photoUrl(name) { return `/photos/${name}?code=${encodeURIComponent(state.code)}`; }
function logout() {
  localStorage.removeItem('code');
  state.code = '';
  $('main').classList.add('hidden');
  $('setup').classList.remove('hidden');
}

// ---------- 설정 화면 ----------
$('btnEnter').onclick = async () => {
  const code = $('inCode').value.trim();
  const name = $('inName').value.trim();
  if (!code || !name) { $('setupErr').textContent = 'Please enter both the code and your name.'; return; }
  $('btnEnter').disabled = true;
  try {
    const res = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ code }) });
    if (!res.ok) { $('setupErr').textContent = "That code doesn't match."; return; }
    state.code = code; state.name = name;
    localStorage.setItem('code', code); localStorage.setItem('name', name);
    enterMain();
  } catch { $('setupErr').textContent = "Can't reach the server."; }
  finally { $('btnEnter').disabled = false; }
};

// ---------- 작성 ----------
$('moods').innerHTML = MOODS.map(m => `<button data-m="${m}">${m}</button>`).join('');
$('moods').onclick = (e) => {
  const b = e.target.closest('button'); if (!b) return;
  state.mood = state.mood === b.dataset.m ? '' : b.dataset.m;
  [...$('moods').children].forEach(x => x.classList.toggle('sel', x.dataset.m === state.mood));
};

$('inPhoto').onchange = async (e) => {
  for (const file of [...e.target.files].slice(0, 10 - state.photos.length)) {
    state.photos.push(await compress(file));
  }
  e.target.value = '';
  renderThumbs();
};
function renderThumbs() {
  $('thumbs').innerHTML = state.photos.map((p, i) =>
    `<div class="t"><img src="${p}"><button class="x" data-i="${i}">✕</button></div>`).join('');
}
$('thumbs').onclick = (e) => {
  const b = e.target.closest('.x'); if (!b) return;
  state.photos.splice(+b.dataset.i, 1); renderThumbs();
};

// 사진을 긴 변 1280px, JPEG 품질 0.8로 압축 → 업로드 용량 절약
function compress(file) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      const MAX = 1280;
      const scale = Math.min(1, MAX / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * scale);
      c.height = Math.round(img.height * scale);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src);
      resolve(c.toDataURL('image/jpeg', 0.8));
    };
    img.src = URL.createObjectURL(file);
  });
}

$('btnSave').onclick = async () => {
  const text = $('inText').value;
  if (!text.trim() && !state.photos.length) { toast('Add some text or a photo'); return; }
  $('btnSave').disabled = true;
  try {
    await api('/api/entries', {
      method: 'POST',
      body: JSON.stringify({
        author: state.name, text, date: $('inDate').value,
        mood: state.mood, photos: state.photos,
        tz: Intl.DateTimeFormat().resolvedOptions().timeZone,
      }),
    });
    $('inText').value = ''; state.photos = []; state.mood = '';
    renderThumbs();
    [...$('moods').children].forEach(x => x.classList.remove('sel'));
    toast("Saved today's entry ♥");
    await refresh();
  } catch (e) { toast('Save failed: ' + e.message); }
  finally { $('btnSave').disabled = false; }
};

// ---------- 타임라인 ----------
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const WDAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const fmtDay = (d) => {
  const [y, m, dd] = d.split('-').map(Number);
  const label = `${MONTHS[m - 1]} ${dd} (${WDAYS[new Date(y, m - 1, dd).getDay()]})`;
  return d === localDate() ? `Today · ${label}` : label;
};
function localDate(offsetDays = 0) {
  const d = new Date(Date.now() + offsetDays * 86400000);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
function fmtTime(iso, tz) {
  const opt = { hour: 'numeric', minute: '2-digit', hour12: true };
  let s = new Date(iso).toLocaleTimeString('en-US', opt);
  // 작성자가 다른 시간대에 있으면 그쪽 현지 시간도 같이 표시
  const myTz = Intl.DateTimeFormat().resolvedOptions().timeZone;
  if (tz && tz !== myTz) {
    try { s += ` (their time ${new Date(iso).toLocaleTimeString('en-US', { ...opt, timeZone: tz })})`; } catch {}
  }
  return s;
}
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function renderTimeline() {
  const groups = {};
  for (const e of state.entries) (groups[e.date] ||= []).push(e);
  const days = Object.keys(groups).sort().reverse();
  if (!days.length) {
    $('timeline').innerHTML = `<div class="empty">No entries yet.<br>Write today's first page ✏️</div>`;
    return;
  }
  $('timeline').innerHTML = days.map((d) => `
    <section class="day">
      <div class="day-label">${fmtDay(d)}</div>
      ${groups[d].map((e) => `
        <article class="entry ${e.author === state.name ? 'mine' : ''}">
          <div class="meta">
            <span class="who">${esc(e.author)}</span>
            ${e.mood ? `<span class="mood">${e.mood}</span>` : ''}
            <span class="time">${fmtTime(e.createdAt, e.tz)}</span>
          </div>
          <div class="text">${esc(e.text)}</div>
          ${e.photos.length ? `<div class="pics">${e.photos.map((p) => `<img loading="lazy" src="${photoUrl(p)}" data-full="${photoUrl(p)}">`).join('')}</div>` : ''}
          ${e.author === state.name ? `<button class="del" data-id="${e.id}">Delete</button>` : ''}
        </article>`).join('')}
    </section>`).join('');
}
$('timeline').onclick = async (e) => {
  const img = e.target.closest('img[data-full]');
  if (img) { $('viewerImg').src = img.dataset.full; $('viewer').classList.add('on'); return; }
  const del = e.target.closest('.del');
  if (del && confirm('Delete this entry?')) {
    try { await api('/api/entries/' + del.dataset.id, { method: 'DELETE' }); await refresh(); }
    catch (err) { toast('Delete failed: ' + err.message); }
  }
};
$('viewer').onclick = () => $('viewer').classList.remove('on');

// ---------- 새로고침 & 시작 ----------
async function refresh() {
  const { entries } = await api('/api/entries');
  state.entries = entries;
  renderTimeline();
  const dates = entries.map((e) => e.date);
  if (dates.length) {
    const first = dates.sort()[0].split('-').map(Number);
    const days = Math.floor((Date.now() - new Date(first[0], first[1] - 1, first[2])) / 86400000) + 1;
    $('daysBadge').textContent = `Day ${days} of our diary`;
  }
}
function toast(msg) {
  $('toast').textContent = msg;
  $('toast').classList.add('on');
  clearTimeout(toast.t);
  toast.t = setTimeout(() => $('toast').classList.remove('on'), 2200);
}
async function enterMain() {
  $('setup').classList.add('hidden');
  $('main').classList.remove('hidden');
  $('inDate').value = localDate();
  try { await refresh(); } catch {}
}
if (state.code && state.name) enterMain();
else $('setup').classList.remove('hidden');
setInterval(() => { if (state.code) refresh().catch(() => {}); }, 30000); // 30초마다 상대 글 동기화
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && state.code) refresh().catch(() => {});
});
</script>
</body>
</html>
