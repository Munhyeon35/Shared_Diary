<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4eee1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Our Diary">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<title>Our Diary</title>
<style>
  :root {
    --bg: #f4eee1;          /* desk the book sits on */
    --paper: #fffefb;
    --ink: #38332b;
    --ink-soft: #74695c;
    --line: #e5dac6;
    --me: #d4402f;
    --me-soft: #ffe9e3;
    --you: #2a72b8;
    --you-soft: #e8f0fa;
    --today: #d4402f;
    --on-me: #ffffff;      /* text that sits on the accent */
    --tape-a: rgba(246, 232, 205, 0.86);   /* washi tape holding a print down */
    --tape-b: rgba(236, 216, 180, 0.80);
    --shadow: rgba(122, 98, 66, 0.16);
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #191713;
      --paper: #262119;
      --ink: #ece5d7;
      --ink-soft: #a09587;
      --line: #3a3329;
      --me: #ff8a72;
      --me-soft: #3d2a22;
      --you: #7fb3e0;
      --you-soft: #223141;
      --today: #ff8a72;
      --on-me: #241a15;
      --tape-a: rgba(122, 104, 76, 0.72);
      --tape-b: rgba(96, 81, 58, 0.66);
      --shadow: rgba(0, 0, 0, 0.55);
    }
  }
  :root[data-theme="dark"] {
    --bg: #191713;
    --paper: #262119;
    --ink: #ece5d7;
    --ink-soft: #a09587;
    --line: #3a3329;
    --me: #ff8a72;
    --me-soft: #3d2a22;
    --you: #7fb3e0;
    --you-soft: #223141;
    --today: #ff8a72;
    --on-me: #241a15;
    --tape-a: rgba(122, 104, 76, 0.72);
    --tape-b: rgba(96, 81, 58, 0.66);
    --shadow: rgba(0, 0, 0, 0.55);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--ink);
    min-height: 100dvh;
    padding-bottom: env(safe-area-inset-bottom);
  }
  #app { max-width: 1040px; margin: 0 auto; padding: 0 14px 60px; }

  /* ---- header ---- */
  header {
    padding: calc(14px + env(safe-area-inset-top)) 2px 12px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  header h1 { font-family: var(--serif); font-size: 20px; font-weight: 600; letter-spacing: 0.2px; }
  header h1 .heart { color: var(--me); }
  #daysBadge { font-size: 12px; color: var(--ink-soft); }

  /* ---- setup (first-run) screen ---- */
  .setup {
    margin-top: 8vh; max-width: 380px; margin-inline: auto;
    background: var(--paper); border: 1px solid var(--line);
    border-radius: 6px; padding: 30px 24px; text-align: center;
    box-shadow: 0 10px 30px var(--shadow);
  }
  .setup .big { font-size: 40px; margin-bottom: 10px; }
  .setup h2 { font-family: var(--serif); font-size: 22px; font-weight: 600; margin-bottom: 8px; }
  .setup p { font-size: 13.5px; color: var(--ink-soft); margin-bottom: 6px; line-height: 1.65; }
  .setup label { display: block; text-align: left; font-size: 12px; color: var(--ink-soft); margin: 16px 0 5px; }
  .setup input {
    width: 100%; font-size: 16px; padding: 11px 13px; font-family: inherit;
    border: 1.5px solid var(--line); border-radius: 8px; background: var(--bg);
    color: var(--ink); outline: none;
  }
  .setup input:focus { border-color: var(--me); }
  .setup .err { color: var(--me); font-size: 13px; margin-top: 12px; min-height: 18px; }
  button.primary {
    width: 100%; margin-top: 16px; padding: 13px; font-size: 15.5px; font-weight: 700;
    background: var(--me); color: var(--on-me); border: none; border-radius: 8px; cursor: pointer;
  }
  button.primary:active { transform: scale(0.985); }
  button.primary:disabled { opacity: 0.5; }

  /* ---- date bar + calendar ---- */
  .datebar {
    position: relative; display: flex; align-items: center; justify-content: center;
    gap: 6px; margin-bottom: 4px;
  }
  .navbtn {
    width: 34px; height: 34px; flex: none; border-radius: 50%;
    border: 1px solid var(--line); background: var(--paper); color: var(--ink);
    font-size: 17px; line-height: 1; cursor: pointer;
  }
  .navbtn:disabled { opacity: 0.3; cursor: default; }
  .date-btn {
    display: flex; align-items: center; gap: 8px;
    font-family: var(--serif); font-size: 17px; color: var(--ink);
    background: none; border: none; cursor: pointer; padding: 6px 10px;
    border-bottom: 1.5px solid transparent; border-radius: 4px;
  }
  .date-btn:hover, .date-btn:focus-visible { border-bottom-color: var(--me); outline: none; }
  .date-btn .caret { font-size: 10px; color: var(--ink-soft); }
  .today-chip {
    font-family: var(--sans); font-size: 10.5px; font-weight: 700; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--on-me); background: var(--me);
    padding: 3px 8px; border-radius: 20px;
  }
  .spread-status {
    text-align: center; font-size: 12px; color: var(--ink-soft);
    min-height: 18px; margin-bottom: 12px;
  }
  .spread-status .done { color: var(--me); font-weight: 700; }

  .cal {
    position: absolute; top: 44px; left: 50%; transform: translateX(-50%);
    z-index: 30; width: 288px; padding: 12px;
    background: var(--paper); border: 1px solid var(--line); border-radius: 10px;
    box-shadow: 0 12px 34px var(--shadow);
  }
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .cal-head .m { font-family: var(--serif); font-size: 15px; }
  .cal-head button {
    width: 28px; height: 28px; border: none; background: none; cursor: pointer;
    color: var(--ink); font-size: 15px; border-radius: 6px;
  }
  .cal-head button:hover { background: var(--bg); }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .cal-grid .wd {
    font-size: 10px; color: var(--ink-soft); text-align: center;
    padding-bottom: 4px; font-weight: 700;
  }
  .cal-grid button {
    position: relative; aspect-ratio: 1; border: none; background: none; cursor: pointer;
    font-family: var(--sans); font-size: 12.5px; color: var(--ink); border-radius: 7px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  }
  .cal-grid button:hover:not(:disabled) { background: var(--bg); }
  .cal-grid button:disabled { color: var(--ink-soft); opacity: 0.35; cursor: default; }
  .cal-grid button.sel { background: var(--me); color: var(--on-me); }
  .cal-grid button.today:not(.sel) { outline: 1.5px solid var(--today); }
  .cal-grid .dots { display: flex; gap: 2px; height: 4px; }
  .cal-grid .dots i { width: 4px; height: 4px; border-radius: 50%; display: block; }
  .cal-grid .dots i.m { background: var(--me); }
  .cal-grid .dots i.y { background: var(--you); }
  .cal-grid button.sel .dots i { background: var(--on-me); }
  .cal-legend {
    display: flex; gap: 12px; justify-content: center; margin-top: 10px;
    font-size: 10.5px; color: var(--ink-soft);
  }
  .cal-legend span { display: flex; align-items: center; gap: 4px; }
  .cal-legend i { width: 5px; height: 5px; border-radius: 50%; display: block; }

  /* ---- the book: two facing pages ---- */
  .book {
    display: grid; grid-template-columns: 1fr 1px 1fr;
    background: var(--paper);
    border: 1px solid var(--line); border-radius: 4px;
    box-shadow: 0 14px 40px var(--shadow);
    overflow: hidden;
  }
  .spine {
    background: linear-gradient(to right,
      color-mix(in srgb, var(--shadow) 55%, transparent),
      color-mix(in srgb, var(--shadow) 20%, transparent));
  }
  .page { padding: 18px 20px 20px; min-height: 640px; display: flex; flex-direction: column; }
  .page-head {
    display: flex; align-items: center; gap: 8px;
    padding-bottom: 8px; margin-bottom: 10px; border-bottom: 1px solid var(--line);
  }
  .page-head .who { font-family: var(--serif); font-size: 15px; font-weight: 600; color: var(--you); }
  .page-mine .page-head .who { color: var(--me); }
  .page-head .time { margin-left: auto; font-size: 11px; color: var(--ink-soft); }
  .page-head .edited {
    font-size: 10.5px; color: var(--ink-soft); font-style: italic;
    background: none; border: none; padding: 0; cursor: pointer;
    font-family: inherit; text-decoration: underline dotted;
  }
  .page-head .edited:hover, .page-head .edited:focus-visible { color: var(--ink); outline: none; }

  /* ---- edit history ---- */
  #hist {
    position: fixed; inset: 0; z-index: 55; display: none;
    align-items: center; justify-content: center; padding: 20px;
    background: rgba(38, 30, 20, 0.42);
  }
  #hist.on { display: flex; }
  .hist-box {
    width: 100%; max-width: 340px; background: var(--paper);
    border: 1px solid var(--line); border-radius: 10px; padding: 18px 18px 14px;
    box-shadow: 0 16px 44px var(--shadow);
  }
  .hist-box h3 { font-family: var(--serif); font-size: 16px; font-weight: 600; margin-bottom: 3px; }
  .hist-box .sub { font-size: 11.5px; color: var(--ink-soft); margin-bottom: 12px; }
  .hist-box ol { list-style: none; max-height: 46vh; overflow-y: auto; }
  .hist-box li {
    display: flex; align-items: baseline; gap: 10px;
    padding: 7px 0; border-top: 1px solid var(--line); font-size: 12.5px;
  }
  .hist-box li:first-child { border-top: none; }
  .hist-box .lbl {
    flex: none; width: 52px; font-size: 10px; font-weight: 700;
    letter-spacing: 0.05em; text-transform: uppercase; color: inherit;
  }
  .hist-box .ts { font-variant-numeric: tabular-nums; }
  .hist-box .ts .their { font-size: 11px; opacity: 0.7; }
  /* the newest save carries the author's colour; earlier ones recede */
  .hist-box li.past { color: var(--ink-soft); }
  .hist-box li.latest { color: var(--me); font-weight: 600; }
  #hist.yours .hist-box li.latest { color: var(--you); }
  .hist-box .close {
    width: 100%; margin-top: 12px; padding: 9px; font-size: 13.5px;
    background: var(--bg); color: var(--ink); border: 1px solid var(--line);
    border-radius: 7px; cursor: pointer;
  }

  /* A blank page. It keeps a fixed shape and is its own container, so a
     layout made on a laptop lands identically on a phone. */
  .paper-body {
    position: relative; flex: 1; overflow: hidden;
    aspect-ratio: 72 / 100;
    container-type: inline-size;
  }
  #editor.empty::after {
    content: 'Photos, text and stickers — put them anywhere';
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: var(--ink-soft); font-size: 13px; font-style: italic; opacity: .65; pointer-events: none;
  }
  .diary-type { font-family: var(--serif); }

  /* ---- anything laid on a page ---- */
  .ci {
    position: absolute; touch-action: none; user-select: none;
    transform: translate(-50%, -50%) rotate(var(--r, 0deg)) scale(var(--s, 1));
    cursor: grab;
  }
  .ci.locked { cursor: default; }
  .ci:active { cursor: grabbing; }
  .ci-k-text, .ci-k-photo { width: calc(var(--w, 60) * 1%); }
  .ci-face { display: block; }
  .ci-text {
    font-family: var(--serif); line-height: 1.5; white-space: pre-wrap; word-break: break-word;
    color: var(--ink); font-size: max(12px, calc(var(--fs, 3.4) * 1cqw));
  }
  textarea.ci-text {
    width: 100%; border: none; outline: none; resize: none; overflow: hidden;
    background: color-mix(in srgb, var(--paper) 82%, transparent);
    padding: 0; font-family: var(--serif); cursor: text;
  }
  .ci-photo {
    width: 100%; height: auto; border-radius: 2px; background: var(--paper);
    box-shadow: 0 0 0 4px var(--paper), 0 0 0 5px var(--line), 0 3px 12px var(--shadow);
    -webkit-user-drag: none;
  }
  .ci-sticker { font-size: 7cqw; filter: drop-shadow(0 2px 3px var(--shadow)); }
  .ci-tape {
    width: 20cqw; height: 5.2cqw;
    background:
      repeating-linear-gradient(90deg,
        rgba(255, 255, 255, 0.16) 0 3px, rgba(255, 255, 255, 0) 3px 7px),
      linear-gradient(180deg, var(--tape-a), var(--tape-b));
    box-shadow: 0 1px 3px rgba(90, 72, 48, 0.2); opacity: 0.9;
    clip-path: polygon(3% 0%, 97% 2%, 100% 22%, 97% 48%, 100% 74%,
                       96% 100%, 4% 98%, 0% 76%, 3% 50%, 0% 24%);
  }
  .ci-tape.pink { --tape-a: rgba(246, 205, 208, .86); --tape-b: rgba(234, 178, 184, .8); }
  .ci-tape.mint { --tape-a: rgba(203, 233, 219, .86); --tape-b: rgba(174, 214, 197, .8); }
  .ci-tape.sky  { --tape-a: rgba(203, 224, 243, .86); --tape-b: rgba(174, 203, 231, .8); }
  .ci.sel { outline: 1.5px dashed var(--me); outline-offset: 5px; }
  .ci.editing { outline: 1.5px solid var(--me); outline-offset: 5px; z-index: 9; }
  /* handles keep their size and stay upright however the item is turned */
  .ci-btn {
    position: absolute; width: 22px; height: 22px; border-radius: 50%;
    border: none; cursor: pointer; color: #fff; font-size: 11px; line-height: 1;
    background: rgba(40, 31, 20, 0.72); display: none; touch-action: none; z-index: 2;
    transform: rotate(calc(-1 * var(--r, 0deg))) scale(calc(1 / var(--s, 1)));
  }
  .ci.sel .ci-btn, .ci.editing .ci-btn { display: block; }
  .ci-del { top: -13px; right: -13px; }
  .ci-rs  { bottom: -13px; right: -13px; cursor: nwse-resize; background: var(--me); }
  .ci-wd  { top: 50%; right: -13px; margin-top: -11px; cursor: ew-resize; background: var(--you); }

  /* ---- the tray you pick things from ---- */
  .tray {
    position: fixed; z-index: 40; width: 272px; padding: 12px;
    background: var(--paper); border: 1px solid var(--line);
    border-radius: 10px; box-shadow: 0 12px 34px var(--shadow);
  }
  .tray h4 {
    font-size: 10px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--ink-soft); margin: 2px 0 7px;
  }
  .tray .grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 2px; }
  .tray .grid button {
    aspect-ratio: 1; border: none; background: none; cursor: pointer;
    font-size: 19px; border-radius: 6px; line-height: 1; padding: 0;
  }
  .tray .grid button:hover { background: var(--bg); }
  .tray .tapes { display: flex; gap: 7px; }
  /* the swatch is sized in pixels: the tray is not the page, so the page's
     own units would blow it up */
  .tape-swatch {
    flex: 1; height: 24px; border: none; cursor: pointer; padding: 0;
    background:
      repeating-linear-gradient(90deg,
        rgba(255, 255, 255, 0.16) 0 3px, rgba(255, 255, 255, 0) 3px 7px),
      linear-gradient(180deg, var(--tape-a), var(--tape-b));
    clip-path: polygon(4% 0%, 96% 3%, 100% 30%, 97% 70%, 96% 100%, 4% 97%, 0% 70%, 3% 30%);
  }
  .tape-swatch.pink { --tape-a: rgba(246, 205, 208, .86); --tape-b: rgba(234, 178, 184, .8); }
  .tape-swatch.mint { --tape-a: rgba(203, 233, 219, .86); --tape-b: rgba(174, 214, 197, .8); }
  .tape-swatch.sky  { --tape-a: rgba(203, 224, 243, .86); --tape-b: rgba(174, 203, 231, .8); }

  /* ---- the two buttons that open it ---- */
  /* Buttons carry a drawn mark rather than a word: the words crowded the
     page, and an emoji would be a different picture on each phone. */
  .icon-btn {
    width: 38px; height: 38px; flex: none; display: grid; place-items: center;
    padding: 0; border: 1px solid var(--line); border-radius: 9px;
    background: var(--bg); color: var(--ink-soft); cursor: pointer;
  }
  .icon-btn:hover, .icon-btn:focus-visible { color: var(--me); border-color: var(--me); outline: none; }
  .icon-btn svg, .head-decor svg { width: 21px; height: 21px; display: block; }
  .icon-btn svg, .head-decor svg {
    fill: none; stroke: currentColor; stroke-width: 1.6;
    stroke-linecap: round; stroke-linejoin: round;
  }
  .head-decor {
    margin-left: 6px; flex: none; display: grid; place-items: center;
    width: 28px; height: 28px; padding: 0; color: var(--ink-soft);
    background: none; border: none; cursor: pointer; border-radius: 6px; opacity: 0.6;
  }
  .head-decor:hover { opacity: 1; color: var(--you); background: var(--bg); }



  .page-empty {
    flex: 1; display: flex; align-items: center; justify-content: center;
    text-align: center; font-size: 13.5px; color: var(--ink-soft);
    font-style: italic; line-height: 1.8; padding: 20px;
  }

  .moods { display: flex; gap: 3px; }
  .moods button {
    font-size: 16px; background: none; border: 1.5px solid transparent;
    border-radius: 50%; width: 28px; height: 28px; cursor: pointer; line-height: 1;
  }
  .moods button.sel { border-color: var(--me); background: var(--me-soft); }
  .mood-shown { font-size: 16px; }

  .page-actions {
    display: flex; align-items: center; gap: 8px;
    margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line);
  }
  .btn-save {
    margin-left: auto; padding: 9px 20px; font-size: 14px; font-weight: 700;
    background: var(--me); color: var(--on-me); border: none; border-radius: 7px; cursor: pointer;
  }
  .btn-save:disabled { opacity: 0.45; }
  .saved-note { font-size: 11.5px; color: var(--ink-soft); }
  .saved-note.dirty { color: var(--me); font-weight: 700; }

  @media (max-width: 760px) {
    .book { grid-template-columns: 1fr; }
    .spine { height: 1px; background: var(--line); }
    .page { min-height: 0; padding: 16px 16px 18px; }
    .paper-body { min-height: 392px; }          /* 14 ruled lines */
    .page-empty { min-height: 140px; }
  }

  /* ---- photo viewer & toast ---- */
  #viewer {
    position: fixed; inset: 0; background: rgba(28, 22, 15, 0.94); z-index: 50;
    display: none; align-items: center; justify-content: center;
  }
  #viewer.on { display: flex; }
  #viewer img { max-width: 96vw; max-height: 84vh; border-radius: 4px; }
  .viewer-save {
    position: absolute; left: 50%; transform: translateX(-50%);
    bottom: calc(22px + env(safe-area-inset-bottom));
    background: rgba(255, 254, 251, 0.96); color: #2c261e; text-decoration: none;
    font-family: var(--sans); font-size: 13.5px; font-weight: 700;
    padding: 11px 20px; border-radius: 22px; white-space: nowrap;
  }
  .viewer-save:active { transform: translateX(-50%) scale(0.97); }
  #toast {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
    background: var(--ink); color: var(--paper); font-size: 13px;
    padding: 10px 18px; border-radius: 20px; opacity: 0; transition: opacity .25s;
    pointer-events: none; z-index: 60; white-space: nowrap;
  }
  #toast.on { opacity: 1; }
  .hidden { display: none !important; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Our Diary <span class="heart">♥</span></h1>
    <span id="daysBadge"></span>
  </header>

  <!-- first-run setup -->
  <div id="setup" class="setup hidden">
    <div class="big">📖</div>
    <h2>Our Diary</h2>
    <p>A place to share each day, even far apart.<br>Enter with the code only you two know.</p>
    <label>Couple code</label>
    <input id="inCode" type="password" placeholder="Your secret code" autocomplete="off">
    <label>My name (shown on my page)</label>
    <input id="inName" type="text" maxlength="20" placeholder="e.g. Moonhyeon">
    <div class="err" id="setupErr"></div>
    <button class="primary" id="btnEnter">Open our diary</button>
  </div>

  <!-- the diary -->
  <div id="main" class="hidden">
    <div class="datebar">
      <button class="navbtn" id="btnPrev" title="Previous day">‹</button>
      <button class="date-btn" id="btnDate">
        <span id="dateLabel"></span>
        <span class="today-chip hidden" id="todayChip">Today</span>
        <span class="caret">▼</span>
      </button>
      <button class="navbtn" id="btnNext" title="Next day">›</button>
      <div class="cal hidden" id="cal"></div>
    </div>
    <div class="spread-status" id="spreadStatus"></div>

    <div class="book">
      <section class="page page-mine">
        <div class="page-head">
          <span class="who" id="myName"></span>
          <div class="moods" id="moods"></div>
          <span class="time" id="myTime"></span>
        </div>
        <div class="paper-body diary-type" id="editor"></div>
        <div class="page-actions">
          <label class="icon-btn" title="Add a photo" aria-label="Add a photo">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3.4" y="5.6" width="17.2" height="13.4" rx="1.6" transform="rotate(-2.5 12 12)"/>
              <circle cx="8.9" cy="10.2" r="1.7"/>
              <path d="M4.6 16.8 9.4 12.6 13 15.4 16.2 12.4 20 16.1"/>
            </svg>
            <input type="file" id="inPhoto" accept="image/*" multiple hidden>
          </label>
          <button class="icon-btn" id="btnText" title="Add a text box" aria-label="Add a text box">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5.2 6.2h13.4M11.9 6.4v11.1"/>
              <path d="M8.6 20.4c1.8-.9 3.5-.9 5.3 0s3.4.9 5.2 0"/>
            </svg>
          </button>
          <button class="icon-btn" id="btnDecor" title="Stickers and tape" aria-label="Stickers and tape">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M9.6 3.6 11.3 8 15.8 9.6 11.3 11.3 9.6 15.8 8 11.3 3.6 9.6 8 8Z"/>
              <path d="M17.2 13.4l.9 2.3 2.3.9-2.3.9-.9 2.3-.9-2.3-2.3-.9 2.3-.9Z"/>
            </svg>
          </button>
          <span class="saved-note" id="savedNote"></span>
          <button class="btn-save" id="btnSave">Save</button>
        </div>
      </section>

      <div class="spine"></div>

      <section class="page page-yours" id="pageYours"></section>
    </div>
  </div>
</div>

<div class="tray hidden" id="tray"></div>
<div id="viewer">
  <img id="viewerImg" alt="">
  <a id="viewerSave" class="viewer-save" download>⬇&nbsp; Save photo</a>
</div>
<div id="hist">
  <div class="hist-box">
    <h3>Edit history</h3>
    <div class="sub" id="histSub"></div>
    <ol id="histList"></ol>
    <button class="close" id="histClose">Close</button>
  </div>
</div>
<div id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
const MOODS = ['😊','🥰','😴','😢','😤','🤒'];
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const WDAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

const state = {
  code: localStorage.getItem('code') || '',
  name: localStorage.getItem('name') || '',
  date: '',          // the spread currently open
  entries: [],
  mood: '',
  items: [],         // my page for the open date, as things laid on it
  editing: null,     // index of the text box being written in
  dirty: false,      // my page has unsaved changes
  calMonth: null,    // first day of the month shown in the calendar
};

// ---------- dates ----------
function localDate(offsetDays = 0) {
  const d = new Date(Date.now() + offsetDays * 86400000);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
const ymd = (dt) => `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
const parseDate = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const shiftDate = (s, days) => { const d = parseDate(s); d.setDate(d.getDate() + days); return ymd(d); };
function longDate(s) {
  const d = parseDate(s);
  return `${WDAYS[d.getDay()]}, ${MONTHS[d.getMonth()]} ${d.getDate()}`;
}
function fmtTime(iso, tz) {
  const opt = { hour: 'numeric', minute: '2-digit', hour12: true };
  let s = new Date(iso).toLocaleTimeString('en-US', opt);
  // If the author is in a different time zone, also show their local time
  const myTz = Intl.DateTimeFormat().resolvedOptions().timeZone;
  if (tz && tz !== myTz) {
    try { s += ` (their time ${new Date(iso).toLocaleTimeString('en-US', { ...opt, timeZone: tz })})`; } catch {}
  }
  return s;
}
// Full stamp for the edit log: edits can land days after the page was written
function fmtStamp(iso, tz) {
  const d = new Date(iso);
  const opt = { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit', hour12: true };
  let s = esc(d.toLocaleString('en-US', opt));
  const myTz = Intl.DateTimeFormat().resolvedOptions().timeZone;
  if (tz && tz !== myTz) {
    try {
      s += ` <span class="their">· their time ${esc(d.toLocaleString('en-US', { ...opt, timeZone: tz }))}</span>`;
    } catch {}
  }
  return s;
}
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// Pages written before the edit log existed only carry createdAt/updatedAt
function editLog(e) {
  if (Array.isArray(e.edits) && e.edits.length) return e.edits;
  const log = [{ at: e.createdAt, tz: e.tz }];
  if (e.updatedAt && e.updatedAt !== e.createdAt) log.push({ at: e.updatedAt, tz: e.tz });
  return log;
}
function showHistory(e) {
  const log = editLog(e);
  $('histSub').textContent = `${e.author} · ${longDate(e.date)}`;
  // newest first; only the newest save is coloured, the rest recede
  $('histList').innerHTML = log.map((r, i) => ({
    label: i === 0 ? 'Updated' : 'Edited',
    stamp: fmtStamp(r.at, r.tz),
    latest: i === log.length - 1,
  })).reverse().map((r) =>
    `<li class="${r.latest ? 'latest' : 'past'}">
       <span class="lbl">${r.label}</span>
       <span class="ts">${r.stamp}</span>
     </li>`).join('');
  $('hist').classList.toggle('yours', e.author !== state.name);
  $('hist').classList.add('on');
}
function closeHistory() { $('hist').classList.remove('on'); }
$('histClose').onclick = closeHistory;
$('hist').onclick = (e) => { if (e.target.id === 'hist') closeHistory(); };

// ---------- API ----------
async function api(path, opts = {}) {
  const res = await fetch(path, {
    ...opts,
    headers: { 'Content-Type': 'application/json', 'x-couple-code': state.code, ...(opts.headers || {}) },
  });
  if (res.status === 401) { logout(); throw new Error('unauthorized'); }
  if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || res.status);
  return res.json();
}
function photoUrl(name) { return `/photos/${name}?code=${encodeURIComponent(state.code)}`; }
const thumbSrc = (p) => (p.startsWith('data:') ? p : photoUrl(p));
function logout() {
  localStorage.removeItem('code');
  state.code = '';
  $('main').classList.add('hidden');
  $('setup').classList.remove('hidden');
}

// entries for one date, split into mine / partner's
function pagesFor(date) {
  const day = state.entries.filter((e) => e.date === date);
  return { mine: day.find((e) => e.author === state.name), yours: day.find((e) => e.author !== state.name) };
}
function partnerName() {
  const other = state.entries.find((e) => e.author !== state.name);
  return other ? other.author : '';
}

// ---------- setup screen ----------
$('btnEnter').onclick = async () => {
  const code = $('inCode').value.trim();
  const name = $('inName').value.trim();
  if (!code || !name) { $('setupErr').textContent = 'Please enter both the code and your name.'; return; }
  $('btnEnter').disabled = true;
  try {
    const res = await fetch('/api/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ code }),
    });
    if (!res.ok) { $('setupErr').textContent = "That code doesn't match."; return; }
    state.code = code; state.name = name;
    localStorage.setItem('code', code); localStorage.setItem('name', name);
    enterMain();
  } catch { $('setupErr').textContent = "Can't reach the server."; }
  finally { $('btnEnter').disabled = false; }
};

// ---------- my page (left) ----------
$('moods').innerHTML = MOODS.map((m) => `<button data-m="${m}" title="mood">${m}</button>`).join('');
$('moods').onclick = (e) => {
  const b = e.target.closest('button'); if (!b) return;
  state.mood = state.mood === b.dataset.m ? '' : b.dataset.m;
  [...$('moods').children].forEach((x) => x.classList.toggle('sel', x.dataset.m === state.mood));
  markDirty();
};
// ---------- a page is a set of things laid on it ----------
// Every item knows where it sits (x, y as a share of the page), how it is
// turned and how big it is. The page keeps a fixed shape, so a page laid out
// on a laptop looks the same on a phone.
const STICKERS = ['❤️','💕','⭐','✨','🌸','🌿','☀️','🌙','☁️','🍀','🔥','🎈',
                  '🎂','☕','🍜','🍺','🐱','🐶','😊','🥰','😂','😴','👍','✈️'];
const TAPES = ['cream', 'pink', 'mint', 'sky'];
const itemsOf = (entry) => (entry && Array.isArray(entry.items) ? entry.items : []);
const entryById = (id) => state.entries.find((e) => e.id === id);
const canTouch = (it, side) =>
  side === 'mine' || (it.k === 'sticker' && (it.by || '') === state.name);

function markDirty() {
  state.dirty = true;
  $('savedNote').textContent = 'Unsaved';
  $('savedNote').classList.add('dirty');
}

function itemHtml(it, i, side) {
  const st = [`left:${it.x}%`, `top:${it.y}%`, `--r:${it.r || 0}deg`, `--s:${it.s || 1}`];
  if (it.w != null) st.push(`--w:${it.w}`);
  if (it.fs != null) st.push(`--fs:${it.fs}`);
  let face;
  if (it.k === 'text') face = `<div class="ci-face ci-text">${esc(it.v || '')}</div>`;
  else if (it.k === 'photo') face =
    `<img class="ci-face ci-photo" src="${thumbSrc(it.src)}" data-full="${thumbSrc(it.src)}"
          data-name="${esc(state.date + '-' + (i + 1))}" alt="diary photo">`;
  else if (it.k === 'tape') face = `<i class="ci-face ci-tape ${esc(it.v)}"></i>`;
  else face = `<i class="ci-face ci-sticker">${esc(it.v)}</i>`;
  const mine = canTouch(it, side);
  return `<div class="ci ci-k-${it.k}${mine ? '' : ' locked'}" data-i="${i}" style="${st.join(';')}"
       ${it.by ? `title="by ${esc(it.by)}"` : ''}>${face}
       ${mine ? `<button class="ci-btn ci-del" title="Remove">✕</button>
                 <button class="ci-btn ci-rs" title="Turn and resize"></button>
                 ${it.k === 'text' ? '<button class="ci-btn ci-wd" title="Width"></button>' : ''}` : ''}
     </div>`;
}

// The left page is mine to lay out; the right one I may only add stickers to.
function paintPage(host, items, side) {
  if (!host) return;
  host.innerHTML = items.map((it, i) => itemHtml(it, i, side)).join('');
  host.dataset.side = side;
}
function renderMine() {
  paintPage($('editor'), state.items, 'mine');
  $('editor').classList.toggle('empty', !state.items.length);
}
function renderTheirs() {
  const { yours } = pagesFor(state.date);
  const host = $('pageYours').querySelector('.paper-body');
  if (host && yours) { paintPage(host, itemsOf(yours), 'yours'); host.dataset.entry = yours.id; }
}

// ---------- putting something new down ----------
function addItem(side, it) {
  if (side === 'mine') {
    state.items = state.items.concat([{ ...it, by: state.name }]);
    renderMine();
    markDirty();
    return;
  }
  const { yours } = pagesFor(state.date);
  if (!yours) return;
  yours.items = itemsOf(yours).concat([{ ...it, by: state.name }]);
  renderTheirs();
  saveStickers(yours);
}
// a fresh thing lands near the middle, nudged so the next one does not hide it
function dropSpot(n) {
  return { x: 42 + ((n * 9) % 26), y: 26 + ((n * 13) % 40), r: (n % 2 ? 1 : -1) * (3 + (n * 5) % 9), s: 1 };
}

async function saveStickers(entry) {
  try {
    const res = await api(`/api/entries/${entry.id}/stickers`, {
      method: 'PUT',
      body: JSON.stringify({
        by: state.name,
        stickers: itemsOf(entry).filter((it) => it.k === 'sticker' && (it.by || '') === state.name),
      }),
    });
    entry.items = res.items;
    renderTheirs();
  } catch (e) { toast('Could not leave that: ' + e.message); }
}

// ---------- the tray you pick from ----------
function openTray(anchor, side) {
  if (side === 'yours' && !pagesFor(state.date).yours) {
    toast('Nothing to decorate here yet');
    return;
  }
  state.trayFor = side;
  $('tray').innerHTML = `
    <h4>Stickers</h4>
    <div class="grid">${STICKERS.map((e) => `<button data-st="${e}">${e}</button>`).join('')}</div>
    ${side === 'mine' ? `
      <h4 style="margin-top:10px">Tape</h4>
      <div class="tapes">${TAPES.map((t) =>
        `<button class="tape-swatch ${t}" data-tape="${t}" title="${t} tape"></button>`).join('')}</div>
` : ''}`;
  $('tray').classList.remove('hidden');
  const r = anchor.getBoundingClientRect(), t = $('tray').getBoundingClientRect();
  $('tray').style.left = Math.min(Math.max(8, r.left), innerWidth - t.width - 8) + 'px';
  $('tray').style.top = (r.top - t.height - 8 > 8 ? r.top - t.height - 8 : r.bottom + 8) + 'px';
}
const closeTray = () => $('tray').classList.add('hidden');

$('tray').onclick = (e) => {
  const st = e.target.closest('[data-st]');
  const tp = e.target.closest('[data-tape]');
  if (!st && !tp) return;
  const side = state.trayFor;
  const n = side === 'mine' ? state.items.length : itemsOf(pagesFor(state.date).yours).length;
  const at = dropSpot(n);
  closeTray();
  addItem(side, tp ? { k: 'tape', v: tp.dataset.tape, ...at }
                   : { k: 'sticker', v: st.dataset.st, ...at });
};

// Writing is its own button, not something buried in the tray
$('btnText').onclick = () => {
  addItem('mine', { k: 'text', v: '', w: 60, fs: 3.4, ...dropSpot(state.items.length), r: 0 });
  setTimeout(() => beginEdit(state.items.length - 1), 30);
};
$('btnDecor').onclick = (e) => {
  e.stopPropagation();
  $('tray').classList.contains('hidden') ? openTray(e.currentTarget, 'mine') : closeTray();
};
document.addEventListener('click', (e) => {
  if (!$('tray').classList.contains('hidden') && !e.target.closest('#tray')
      && !e.target.closest('#btnDecor') && !e.target.closest('.head-decor')) closeTray();
});

// ---------- writing in a text box ----------
// The box is a plain textarea only while it is being written in, which keeps
// Korean input safe and leaves dragging to the box itself the rest of the time.
function beginEdit(i) {
  const el = $('editor').querySelector(`.ci[data-i="${i}"]`);
  const it = state.items[i];
  if (!el || !it || it.k !== 'text') return;
  const face = el.querySelector('.ci-face');
  const ta = document.createElement('textarea');
  ta.className = 'ci-face ci-text editing';
  ta.value = it.v || '';
  face.replaceWith(ta);
  el.classList.add('editing');
  state.editing = i;
  const grow = () => { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; };
  grow();
  ta.focus();
  ta.setSelectionRange(ta.value.length, ta.value.length);
  ta.addEventListener('input', () => { it.v = ta.value; grow(); markDirty(); });
  ta.addEventListener('blur', () => {
    state.editing = null;
    it.v = ta.value;
    if (!it.v.trim()) state.items = state.items.filter((_, k) => k !== i);
    renderMine();
    markDirty();
  });
}

// ---------- moving, turning, resizing ----------
let act = null;
const deselect = () => document.querySelectorAll('.ci.sel').forEach((x) => x.classList.remove('sel'));

function listFor(side) {
  return side === 'mine' ? state.items : itemsOf(pagesFor(state.date).yours);
}
function commit(side) {
  if (side === 'mine') markDirty();
  else saveStickers(pagesFor(state.date).yours);
}

document.addEventListener('pointerdown', (e) => {
  const el = e.target.closest('.ci');
  if (!el) { if (!e.target.closest('.ci-btn')) deselect(); return; }
  const host = el.parentElement;
  const side = host.dataset.side;
  const list = listFor(side);
  const i = +el.dataset.i;
  const it = list[i];
  if (!it || !canTouch(it, side)) return;

  const del = e.target.closest('.ci-del');
  if (del) {
    e.preventDefault();
    if (side === 'mine') { state.items = state.items.filter((_, k) => k !== i); renderMine(); markDirty(); }
    else {
      const { yours } = pagesFor(state.date);
      yours.items = itemsOf(yours).filter((_, k) => k !== i);
      renderTheirs();
      saveStickers(yours);
    }
    return;
  }
  // while a box is being written in the caret owns the text, but its handles
  // must still move, turn and widen it
  if (el.classList.contains('editing') && !e.target.closest('.ci-btn')) return;
  e.preventDefault();
  deselect();
  el.classList.add('sel');

  const box = host.getBoundingClientRect();
  const cx = box.left + (it.x / 100) * box.width;
  const cy = box.top + (it.y / 100) * box.height;
  const rs = e.target.closest('.ci-rs');
  const wd = e.target.closest('.ci-wd');
  act = {
    side, it, el, host, box,
    mode: rs ? 'turn' : wd ? 'width' : 'move',
    dx: e.clientX - cx, dy: e.clientY - cy,
    dist0: Math.hypot(e.clientX - cx, e.clientY - cy) || 1,
    ang0: Math.atan2(e.clientY - cy, e.clientX - cx),
    r0: it.r || 0, s0: it.s || 1, w0: it.w || 60, x0: e.clientX,
    moved: false, i,
  };
  (rs || wd || el).setPointerCapture(e.pointerId);
});

document.addEventListener('pointermove', (e) => {
  if (!act) return;
  const box = act.host.getBoundingClientRect();
  act.moved = true;
  if (act.mode === 'move') {
    // keep the middle of a thing on the page: it may hang over an edge, but
    // never so far that it cannot be picked up again
    act.it.x = Math.min(98, Math.max(2, ((e.clientX - act.dx - box.left) / box.width) * 100));
    act.it.y = Math.min(98, Math.max(2, ((e.clientY - act.dy - box.top) / box.height) * 100));
    act.el.style.left = act.it.x + '%';
    act.el.style.top = act.it.y + '%';
  } else if (act.mode === 'turn') {
    const cx = box.left + (act.it.x / 100) * box.width;
    const cy = box.top + (act.it.y / 100) * box.height;
    const dist = Math.hypot(e.clientX - cx, e.clientY - cy);
    const ang = Math.atan2(e.clientY - cy, e.clientX - cx);
    act.it.s = Math.min(6, Math.max(0.2, (act.s0 * dist) / act.dist0));
    act.it.r = Math.max(-180, Math.min(180, act.r0 + ((ang - act.ang0) * 180) / Math.PI));
    act.el.style.setProperty('--s', act.it.s.toFixed(2));
    act.el.style.setProperty('--r', act.it.r.toFixed(1) + 'deg');
  } else {
    act.it.w = Math.min(110, Math.max(8, act.w0 + ((e.clientX - act.x0) / box.width) * 200));
    act.el.style.setProperty('--w', act.it.w.toFixed(1));
  }
});

document.addEventListener('pointerup', () => {
  if (!act) return;
  const { side, moved, it, i } = act;
  act = null;
  if (moved) commit(side);
  else if (side === 'mine' && it.k === 'text') beginEdit(i);   // a tap opens the box
});

// ---------- photos ----------
// Photos come in about a quarter of the page wide, then you place them.
function compress(file) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      const MAX = 1280;
      const scale = Math.min(1, MAX / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * scale);
      c.height = Math.round(img.height * scale);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src);
      resolve(c.toDataURL('image/jpeg', 0.8));
    };
    img.src = URL.createObjectURL(file);
  });
}
$('inPhoto').onchange = async (e) => {
  const files = [...e.target.files].slice(0, 10);
  e.target.value = '';
  for (const f of files) {
    const src = await compress(f);
    const at = dropSpot(state.items.length);
    state.items = state.items.concat([{ k: 'photo', src, w: 42, ...at, by: state.name }]);
  }
  renderMine();
  markDirty();
};

// ---------- saving my page ----------
async function savePage() {
  if (!state.items.length) { toast('Put something on the page first'); return false; }
  $('btnSave').disabled = true;
  try {
    const { entry } = await api('/api/entries', {
      method: 'POST',
      body: JSON.stringify({
        author: state.name, date: state.date, mood: state.mood,
        items: state.items,
        tz: Intl.DateTimeFormat().resolvedOptions().timeZone,
      }),
    });
    state.dirty = false;
    await refresh();
    state.items = itemsOf(entry).map((it) => ({ ...it }));
    renderSpread();
    toast('Saved ♥');
    return true;
  } catch (e) { toast('Save failed: ' + e.message); return false; }
  finally { $('btnSave').disabled = false; }
}
$('btnSave').onclick = savePage;

// The page head shows only the last save; the label says whether that save
// was the original writing or a later edit. Click opens the full log.
function editedTag(e) {
  const log = editLog(e);
  const n = log.length - 1;
  const last = log[n];
  const label = n > 0 ? 'edited' : 'updated';
  return `<button class="edited" data-hist="${e.id}">${label} ${fmtTime(last.at, last.tz)}</button>`;
}

// The partner's page, read only: the same paragraphs and photos, in the same
// order they were written in.

// ---------- rendering one spread ----------
function renderSpread(keepDraft = false) {
  const { mine, yours } = pagesFor(state.date);

  // date bar
  $('dateLabel').textContent = longDate(state.date);
  $('todayChip').classList.toggle('hidden', state.date !== localDate());
  $('btnNext').disabled = state.date >= localDate();
  $('myName').textContent = state.name;

  // Left page — a background refresh must never rebuild it while it is being
  // laid out or written in, or an in-flight Korean composition is cancelled
  // and whatever has been dragged since the last save jumps back.
  const busy = state.dirty || state.editing != null || $('editor').contains(document.activeElement);
  if (!keepDraft || !busy) {
    state.items = itemsOf(mine).map((it) => ({ ...it }));
    renderMine();
    state.mood = mine ? (mine.mood || '') : '';
    [...$('moods').children].forEach((x) => x.classList.toggle('sel', x.dataset.m === state.mood));
    state.dirty = false;
    $('savedNote').classList.remove('dirty');
    $('savedNote').textContent = mine ? 'Saved' : '';
  }
  $('btnSave').textContent = mine ? 'Update' : 'Save';
  $('myTime').innerHTML = mine ? editedTag(mine) : '';

  // right page — read only
  const who = yours ? yours.author : (partnerName() || 'Your partner');
  $('pageYours').innerHTML = yours
    ? `<div class="page-head">
         <span class="who">${esc(yours.author)}</span>
         ${yours.mood ? `<span class="mood-shown">${yours.mood}</span>` : ''}
         <span class="time">${editedTag(yours)}</span>
         <button class="head-decor" id="btnDecorYours" title="Leave a sticker" aria-label="Leave a sticker"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.6 3.6 11.3 8 15.8 9.6 11.3 11.3 9.6 15.8 8 11.3 3.6 9.6 8 8Z"/><path d="M17.2 13.4l.9 2.3 2.3.9-2.3.9-.9 2.3-.9-2.3-2.3-.9 2.3-.9Z"/></svg></button>
       </div>
       <div class="paper-body"></div>`
    : `<div class="page-head"><span class="who">${esc(who)}</span></div>
       <div class="page-empty">This page is still blank.<br>${esc(who)} hasn't written this day yet.</div>`;
  const yb = $('btnDecorYours');
  if (yb) yb.onclick = (e) => {
    e.stopPropagation();
    $('tray').classList.contains('hidden') ? openTray(e.currentTarget, 'yours') : closeTray();
  };

  renderTheirs();

  // soft nudge — never a gate
  const st = $('spreadStatus');
  if (mine && yours) st.innerHTML = '<span class="done">✓ Both pages written</span>';
  else if (yours && !mine) st.textContent = `${who} wrote this day — your page is still blank`;
  else if (mine && !yours) st.textContent = `Waiting for ${who}`;
  else st.textContent = '';

  if (state.calMonth) renderCal();
}

// ---------- calendar ----------
function openCal() {
  state.calMonth = parseDate(state.date); state.calMonth.setDate(1);
  renderCal();
  $('cal').classList.remove('hidden');
}
function closeCal() { $('cal').classList.add('hidden'); state.calMonth = null; }
$('btnDate').onclick = (e) => {
  e.stopPropagation();
  $('cal').classList.contains('hidden') ? openCal() : closeCal();
};
document.addEventListener('click', (e) => {
  if (!$('cal').classList.contains('hidden') && !e.target.closest('.datebar')) closeCal();
});

function renderCal() {
  const first = state.calMonth;
  const y = first.getFullYear(), m = first.getMonth();
  const today = localDate();
  // which days already have pages, and whose
  const marks = {};
  for (const e of state.entries) {
    (marks[e.date] ||= {})[e.author === state.name ? 'm' : 'y'] = true;
  }
  const daysInMonth = new Date(y, m + 1, 0).getDate();
  const lead = new Date(y, m, 1).getDay();
  let cells = '';
  for (let i = 0; i < lead; i++) cells += '<span></span>';
  for (let d = 1; d <= daysInMonth; d++) {
    const ds = ymd(new Date(y, m, d));
    const mk = marks[ds] || {};
    cells += `<button data-d="${ds}" ${ds > today ? 'disabled' : ''}
      class="${ds === state.date ? 'sel' : ''} ${ds === today ? 'today' : ''}">
      <span>${d}</span>
      <span class="dots">${mk.m ? '<i class="m"></i>' : ''}${mk.y ? '<i class="y"></i>' : ''}</span>
    </button>`;
  }
  $('cal').innerHTML = `
    <div class="cal-head">
      <button data-mv="-1">‹</button>
      <span class="m">${MONTHS[m]} ${y}</span>
      <button data-mv="1">›</button>
    </div>
    <div class="cal-grid">
      ${WDAYS.map((w) => `<span class="wd">${w[0]}</span>`).join('')}
      ${cells}
    </div>
    <div class="cal-legend">
      <span><i style="background:var(--me)"></i>${esc(state.name)}</span>
      <span><i style="background:var(--you)"></i>${esc(partnerName() || 'Partner')}</span>
    </div>`;
}
$('cal').onclick = (e) => {
  e.stopPropagation();
  const mv = e.target.closest('[data-mv]');
  if (mv) { state.calMonth.setMonth(state.calMonth.getMonth() + Number(mv.dataset.mv)); renderCal(); return; }
  const day = e.target.closest('[data-d]');
  if (day && !day.disabled) { goTo(day.dataset.d); closeCal(); }
};

// ---------- navigation ----------
async function goTo(date) {
  if (date === state.date) return;
  // Don't silently drop what I typed
  if (state.dirty) {
    if (confirm('Save your changes to this page before leaving?')) {
      if (!(await savePage())) return;
    } else {
      state.dirty = false;
    }
  }
  state.date = date;
  renderSpread();
}
$('btnPrev').onclick = () => goTo(shiftDate(state.date, -1));
$('btnNext').onclick = () => goTo(shiftDate(state.date, 1));
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowLeft') $('btnPrev').click();
  if (e.key === 'ArrowRight' && !$('btnNext').disabled) $('btnNext').click();
  if (e.key === 'Escape') { closeCal(); closeHistory(); $('viewer').classList.remove('on'); }
});

// ---------- photo viewer & edit log ----------
function openHistById(id) {
  const entry = state.entries.find((x) => x.id === id);
  if (entry) showHistory(entry);
}
$('pageYours').onclick = (e) => {
  const img = e.target.closest('img[data-full]');
  if (img) { openViewer(img); return; }
  const h = e.target.closest('[data-hist]');
  if (h) openHistById(h.dataset.hist);
};
$('myTime').onclick = (e) => {
  const h = e.target.closest('[data-hist]');
  if (h) openHistById(h.dataset.hist);
};
// Full size, with the stored photo offered as a file to keep. A photo still
// being written into the page is a data URL and saves straight from the page.
function openViewer(img) {
  const url = img.dataset.full;
  $('viewerImg').src = url;
  const base = (img.dataset.name || 'our-diary').replace(/[^A-Za-z0-9._-]/g, '') || 'our-diary';
  const ext = (/\.(jpg|jpeg|png|webp)/i.exec(url) || [, 'jpg'])[1].toLowerCase();
  const save = $('viewerSave');
  save.download = `${base}.${ext}`;
  save.href = url.startsWith('data:') ? url : url + '&download=' + encodeURIComponent(`${base}.${ext}`);
  $('viewer').classList.add('on');
}
$('viewer').onclick = (e) => {
  if (!e.target.closest('#viewerSave')) $('viewer').classList.remove('on');
};

// ---------- sync ----------
async function refresh() {
  const { entries } = await api('/api/entries');
  state.entries = entries;
  const dates = entries.map((e) => e.date).sort();
  if (dates.length) {
    const days = Math.floor((Date.now() - parseDate(dates[0])) / 86400000) + 1;
    $('daysBadge').textContent = `Day ${days} of our diary`;
  }
}
function toast(msg) {
  $('toast').textContent = msg;
  $('toast').classList.add('on');
  clearTimeout(toast.t);
  toast.t = setTimeout(() => $('toast').classList.remove('on'), 2200);
}
async function enterMain() {
  $('setup').classList.add('hidden');
  $('main').classList.remove('hidden');
  state.date = localDate();
  try { await refresh(); } catch {}
  renderSpread();
}
if (state.code && state.name) enterMain();
else $('setup').classList.remove('hidden');

// keep the partner's side fresh without touching my draft
setInterval(() => {
  if (state.code) refresh().then(() => renderSpread(true)).catch(() => {});
}, 30000);
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && state.code) refresh().then(() => renderSpread(true)).catch(() => {});
});
window.addEventListener('beforeunload', (e) => {
  if (state.dirty) { e.preventDefault(); e.returnValue = ''; }
});
</script>
</body>
</html>
