<title>우리 일기</title>
<style>
  :root {
    --bg: #f7f4ee;
    --card: #fffdf9;
    --ink: #37322c;
    --ink-soft: #8c8378;
    --line: #e8e1d5;
    --me: #d95f43;
    --me-soft: #fbeae5;
    --you: #4f7fb5;
    --banner: #efe9dd;
    --radius: 16px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #211e1a;
      --card: #2b2723;
      --ink: #ece7df;
      --ink-soft: #a39a8d;
      --line: #3c362f;
      --me: #ef8a6d;
      --me-soft: #3d2c26;
      --you: #7fa8d6;
      --banner: #322d27;
    }
  }
  :root[data-theme="dark"] {
    --bg: #211e1a;
    --card: #2b2723;
    --ink: #ece7df;
    --ink-soft: #a39a8d;
    --line: #3c362f;
    --me: #ef8a6d;
    --me-soft: #3d2c26;
    --you: #7fa8d6;
    --banner: #322d27;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    background: var(--bg); color: var(--ink); min-height: 100dvh;
  }
  #app { max-width: 560px; margin: 0 auto; padding: 0 16px 96px; }

  .demo-note {
    margin-top: 14px; background: var(--banner); border: 1px dashed var(--line);
    border-radius: 12px; padding: 10px 14px; font-size: 12.5px; color: var(--ink-soft);
    line-height: 1.6;
  }
  .demo-note b { color: var(--ink); }

  header {
    position: sticky; top: 0; z-index: 10;
    background: color-mix(in srgb, var(--bg) 90%, transparent);
    backdrop-filter: blur(8px);
    padding: 14px 0 10px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 19px; letter-spacing: -0.3px; font-weight: 800; }
  header h1 .heart { color: var(--me); }
  #daysBadge { font-size: 12px; color: var(--ink-soft); }

  .setup {
    margin-top: 8vh; background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 28px 22px; text-align: center;
  }
  .setup .big { font-size: 40px; margin-bottom: 8px; }
  .setup h2 { font-size: 20px; margin-bottom: 6px; }
  .setup p { font-size: 13.5px; color: var(--ink-soft); margin-bottom: 8px; line-height: 1.6; }
  .setup label { display: block; text-align: left; font-size: 12.5px; color: var(--ink-soft); margin: 16px 0 5px; }
  .setup input {
    width: 100%; font-size: 16px; padding: 12px 14px;
    border: 1.5px solid var(--line); border-radius: 12px; background: var(--bg);
    color: var(--ink); outline: none; font-family: inherit;
  }
  .setup input:focus { border-color: var(--me); }
  button.primary {
    width: 100%; margin-top: 20px; padding: 14px; font-size: 16px; font-weight: 700;
    background: var(--me); color: #fff; border: none; border-radius: 12px; cursor: pointer;
  }
  button.primary:active { transform: scale(0.98); }

  .compose {
    margin-top: 16px; background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 14px;
  }
  .compose .row { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
  .compose input[type=date] {
    font-size: 14px; padding: 7px 10px; border: 1px solid var(--line);
    border-radius: 10px; background: var(--bg); color: var(--ink); font-family: inherit;
  }
  .moods { display: flex; gap: 4px; margin-left: auto; }
  .moods button {
    font-size: 18px; background: none; border: 2px solid transparent;
    border-radius: 50%; width: 34px; height: 34px; cursor: pointer;
  }
  .moods button.sel { border-color: var(--me); background: var(--me-soft); }
  .compose textarea {
    width: 100%; min-height: 88px; font-size: 16px; line-height: 1.6;
    border: none; resize: vertical; outline: none; background: transparent;
    color: var(--ink); font-family: inherit;
  }
  .compose textarea::placeholder { color: var(--ink-soft); opacity: 0.7; }
  .thumbs { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
  .thumbs .t { position: relative; }
  .thumbs img { width: 64px; height: 64px; object-fit: cover; border-radius: 10px; display: block; }
  .thumbs .x {
    position: absolute; top: -6px; right: -6px; width: 20px; height: 20px;
    border-radius: 50%; background: var(--ink); color: var(--bg); border: none;
    font-size: 12px; line-height: 1; cursor: pointer;
  }
  .compose .actions { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
  .btn-photo {
    display: flex; align-items: center; gap: 6px; font-size: 14px;
    padding: 9px 14px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--bg); color: var(--ink); cursor: pointer;
  }
  .btn-save {
    margin-left: auto; padding: 10px 22px; font-size: 15px; font-weight: 700;
    background: var(--me); color: #fff; border: none; border-radius: 10px; cursor: pointer;
  }
  .btn-save:disabled { opacity: 0.45; }

  .day { margin-top: 26px; }
  .day-label {
    display: flex; align-items: center; gap: 10px;
    font-size: 13px; font-weight: 700; color: var(--ink-soft);
  }
  .day-label::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .entry {
    margin-top: 10px; background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 14px 14px 12px; position: relative;
    border-left: 4px solid var(--you);
  }
  .entry.mine { border-left-color: var(--me); }
  .entry .meta { display: flex; align-items: baseline; gap: 8px; margin-bottom: 6px; }
  .entry .who { font-weight: 800; font-size: 14px; color: var(--you); }
  .entry.mine .who { color: var(--me); }
  .entry .mood { font-size: 15px; }
  .entry .time { font-size: 11.5px; color: var(--ink-soft); margin-left: auto; }
  .entry .text { font-size: 15px; line-height: 1.75; white-space: pre-wrap; word-break: break-word; }
  .entry .pics { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 6px; margin-top: 10px; }
  .entry .pics img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 10px; cursor: pointer; display: block; }
  .entry .del {
    position: absolute; right: 10px; bottom: 8px; font-size: 11px;
    color: var(--ink-soft); background: none; border: none; cursor: pointer; opacity: 0.7;
  }
  .empty { text-align: center; color: var(--ink-soft); font-size: 14px; margin-top: 60px; line-height: 1.8; }

  #viewer {
    position: fixed; inset: 0; background: rgba(20,15,10,0.92); z-index: 50;
    display: none; align-items: center; justify-content: center;
  }
  #viewer.on { display: flex; }
  #viewer img { max-width: 96vw; max-height: 92vh; border-radius: 8px; }
  #toast {
    position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%);
    background: var(--ink); color: var(--bg); font-size: 13.5px;
    padding: 10px 18px; border-radius: 20px; opacity: 0; transition: opacity .25s;
    pointer-events: none; z-index: 60; white-space: nowrap;
  }
  #toast.on { opacity: 1; }
  .hidden { display: none !important; }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>

<div id="app">
  <header>
    <h1>우리 일기 <span class="heart">♥</span></h1>
    <span id="daysBadge"></span>
  </header>

  <div class="demo-note"><b>체험판</b> — 여기 쓰는 일기는 이 기기 브라우저에만 저장돼요.
  실제로 둘이 공유하려면 서버 버전(couple-diary)을 배포해서 쓰는 거예요.</div>

  <div id="setup" class="setup hidden">
    <div class="big">📖</div>
    <h2>우리 일기</h2>
    <p>멀리 있어도 매일의 하루를 나누는 곳.</p>
    <label>내 이름 (일기에 표시돼요)</label>
    <input id="inName" type="text" maxlength="10" placeholder="예: 문현">
    <button class="primary" id="btnEnter">일기장 열기</button>
  </div>

  <div id="main" class="hidden">
    <div class="compose">
      <div class="row">
        <input type="date" id="inDate">
        <div class="moods" id="moods"></div>
      </div>
      <textarea id="inText" placeholder="오늘 하루는 어땠어요?"></textarea>
      <div class="thumbs" id="thumbs"></div>
      <div class="actions">
        <label class="btn-photo">📷 사진
          <input type="file" id="inPhoto" accept="image/*" multiple style="display:none">
        </label>
        <button class="btn-save" id="btnSave">남기기</button>
      </div>
    </div>
    <div id="timeline"></div>
  </div>
</div>

<div id="viewer"><img id="viewerImg" alt=""></div>
<div id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
const MOODS = ['😊','🥰','😴','😢','😤','🤒'];
const KEY = 'uri-ilgi-demo';
const state = { name: localStorage.getItem(KEY + ':name') || '', mood: '', photos: [], entries: [] };

// ---------- 저장 (데모: localStorage) ----------
function localDate(offsetDays = 0) {
  const d = new Date(Date.now() + offsetDays * 86400000);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
function seed() {
  return [
    { id: 's1', author: '상대방', date: localDate(-1), mood: '🥰',
      text: '(예시) 오늘 퇴근하고 마트 다녀왔어. 네가 좋아하는 라면 보이길래 사진 찍었지. 시차 때문에 목소리 못 들은 날은 여기에 이렇게 남겨두면 되겠다!',
      photos: [], createdAt: new Date(Date.now() - 86400000).toISOString(), tz: 'America/Los_Angeles' },
    { id: 's2', author: '나', date: localDate(-1), mood: '😊',
      text: '(예시) 나는 오늘 회사에서 실험 하나 끝냈어. 전화 시간 전에 서로 하루를 미리 읽고 시작하니까 얘기가 더 깊어질 것 같아.',
      photos: [], createdAt: new Date(Date.now() - 82800000).toISOString(), tz: 'Asia/Seoul' },
  ];
}
function load() {
  try { state.entries = JSON.parse(localStorage.getItem(KEY)) || seed(); }
  catch { state.entries = seed(); }
}
function persist() {
  try { localStorage.setItem(KEY, JSON.stringify(state.entries)); return true; }
  catch { toast('저장 공간이 가득 찼어요 — 사진 수를 줄여 보세요'); return false; }
}

// ---------- 설정 ----------
$('btnEnter').onclick = () => {
  const name = $('inName').value.trim();
  if (!name) { toast('이름을 입력해 주세요'); return; }
  state.name = name;
  localStorage.setItem(KEY + ':name', name);
  enterMain();
};

// ---------- 작성 ----------
$('moods').innerHTML = MOODS.map(m => `<button data-m="${m}">${m}</button>`).join('');
$('moods').onclick = (e) => {
  const b = e.target.closest('button'); if (!b) return;
  state.mood = state.mood === b.dataset.m ? '' : b.dataset.m;
  [...$('moods').children].forEach(x => x.classList.toggle('sel', x.dataset.m === state.mood));
};
$('inPhoto').onchange = async (e) => {
  for (const file of [...e.target.files].slice(0, 4 - state.photos.length)) {
    state.photos.push(await compress(file));
  }
  e.target.value = '';
  renderThumbs();
};
function renderThumbs() {
  $('thumbs').innerHTML = state.photos.map((p, i) =>
    `<div class="t"><img src="${p}" alt=""><button class="x" data-i="${i}">✕</button></div>`).join('');
}
$('thumbs').onclick = (e) => {
  const b = e.target.closest('.x'); if (!b) return;
  state.photos.splice(+b.dataset.i, 1); renderThumbs();
};
function compress(file) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      const MAX = 800; // 데모는 localStorage 용량 한계 때문에 서버 버전보다 작게 압축
      const scale = Math.min(1, MAX / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * scale);
      c.height = Math.round(img.height * scale);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src);
      resolve(c.toDataURL('image/jpeg', 0.7));
    };
    img.src = URL.createObjectURL(file);
  });
}
$('btnSave').onclick = () => {
  const text = $('inText').value;
  if (!text.trim() && !state.photos.length) { toast('내용이나 사진을 넣어 주세요'); return; }
  state.entries.push({
    id: Math.random().toString(36).slice(2, 10),
    author: state.name, text, date: $('inDate').value || localDate(),
    mood: state.mood, photos: state.photos,
    createdAt: new Date().toISOString(),
    tz: Intl.DateTimeFormat().resolvedOptions().timeZone,
  });
  if (!persist()) { state.entries.pop(); return; }
  $('inText').value = ''; state.photos = []; state.mood = '';
  renderThumbs();
  [...$('moods').children].forEach(x => x.classList.remove('sel'));
  toast('오늘의 일기를 남겼어요 ♥');
  render();
};

// ---------- 타임라인 ----------
const fmtDay = (d) => {
  const [y, m, dd] = d.split('-').map(Number);
  const w = '일월화수목금토'[new Date(y, m - 1, dd).getDay()];
  const label = `${m}월 ${dd}일 (${w})`;
  return d === localDate() ? `오늘 · ${label}` : label;
};
function fmtTime(iso, tz) {
  const opt = { hour: '2-digit', minute: '2-digit', hour12: false };
  let s = new Date(iso).toLocaleTimeString('ko-KR', opt);
  const myTz = Intl.DateTimeFormat().resolvedOptions().timeZone;
  if (tz && tz !== myTz) {
    try { s += ` (현지 ${new Date(iso).toLocaleTimeString('ko-KR', { ...opt, timeZone: tz })})`; } catch {}
  }
  return s;
}
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function render() {
  const groups = {};
  const sorted = [...state.entries].sort((a, b) =>
    a.date === b.date ? b.createdAt.localeCompare(a.createdAt) : b.date.localeCompare(a.date));
  for (const e of sorted) (groups[e.date] ||= []).push(e);
  const days = Object.keys(groups);
  if (!days.length) {
    $('timeline').innerHTML = `<div class="empty">아직 일기가 없어요.<br>오늘의 첫 페이지를 남겨 보세요 ✏️</div>`;
  } else {
    $('timeline').innerHTML = days.map((d) => `
      <section class="day">
        <div class="day-label">${fmtDay(d)}</div>
        ${groups[d].map((e) => `
          <article class="entry ${e.author === state.name ? 'mine' : ''}">
            <div class="meta">
              <span class="who">${esc(e.author)}</span>
              ${e.mood ? `<span class="mood">${e.mood}</span>` : ''}
              <span class="time">${fmtTime(e.createdAt, e.tz)}</span>
            </div>
            <div class="text">${esc(e.text)}</div>
            ${e.photos.length ? `<div class="pics">${e.photos.map((p) => `<img loading="lazy" src="${p}" data-full="${p}" alt="일기 사진">`).join('')}</div>` : ''}
            ${e.author === state.name ? `<button class="del" data-id="${e.id}">삭제</button>` : ''}
          </article>`).join('')}
      </section>`).join('');
  }
  const dates = state.entries.map((e) => e.date).sort();
  if (dates.length) {
    const [y, m, dd] = dates[0].split('-').map(Number);
    const days2 = Math.floor((Date.now() - new Date(y, m - 1, dd)) / 86400000) + 1;
    $('daysBadge').textContent = `함께 쓴 지 ${days2}일째`;
  }
}
$('timeline').onclick = (e) => {
  const img = e.target.closest('img[data-full]');
  if (img) { $('viewerImg').src = img.dataset.full; $('viewer').classList.add('on'); return; }
  const del = e.target.closest('.del');
  if (del && confirm('이 일기를 삭제할까요?')) {
    state.entries = state.entries.filter((x) => x.id !== del.dataset.id);
    persist(); render();
  }
};
$('viewer').onclick = () => $('viewer').classList.remove('on');

function toast(msg) {
  $('toast').textContent = msg;
  $('toast').classList.add('on');
  clearTimeout(toast.t);
  toast.t = setTimeout(() => $('toast').classList.remove('on'), 2200);
}
function enterMain() {
  $('setup').classList.add('hidden');
  $('main').classList.remove('hidden');
  $('inDate').value = localDate();
  load(); render();
}
if (state.name) enterMain();
else $('setup').classList.remove('hidden');
</script>
